
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website - Login Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 320px;
            margin: 100px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #bbb;
            text-align: center;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #message {
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .dashboard {
            width: min(700px, 85%);
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #bbb;
            text-align: center;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .card {
            flex: 1 1 140px;
            padding: 20px 10px;
            background: #e0e7ff;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- LOGIN PAGE -->
    <div class="container" id="loginPage">
        <h2>Login</h2>

        <form id="loginForm">
            <input type="email" id="email"
                   placeholder="Enter Email" required>

            <input type="password" id="password"
                   placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </div>

    <!-- DASHBOARD PAGE -->
    <div class="dashboard hidden" id="dashboardPage">
        <h1>Welcome to My Website!</h1>

        <h2 id="welcomeUser">Login Successful!</h2>

        <p>You have successfully logged in to your dashboard.</p>

        <div class="cards">
            <div class="card">
                <h3>Profile</h3>
                <p>View your profile</p>
            </div>

            <div class="card">
                <h3>Settings</h3>
                <p>Manage settings</p>
            </div>

            <div class="card">
                <h3>Services</h3>
                <p>Explore services</p>
            </div>
        </div>

        <button id="logoutButton">Logout</button>
    </div>

    <script>
        // Get registered users from Local Storage
        function getUsers() {
            return JSON.parse(localStorage.getItem("users")) || [];
        }

        // Login form validation
        document.getElementById("loginForm").addEventListener(
            "submit", function(event) {

                event.preventDefault();

                const email = document.getElementById("email")
                    .value.trim().toLowerCase();

                const password =
                    document.getElementById("password").value;

                const users = getUsers();

                // Check registered user details
                const validUser = users.find(function(user) {
                    return user.email === email &&
                           user.password === password;
                });

                if (validUser) {
                    // Hide login page
                    document.getElementById("loginPage")
                        .classList.add("hidden");

                    // Show dashboard
                    document.getElementById("dashboardPage")
                        .classList.remove("hidden");

                    document.getElementById("welcomeUser").textContent =
                        "Login Successful! Welcome, " +
                        (validUser.username || validUser.name || "User");

                } else {
                    document.getElementById("message").textContent =
                        "Incorrect Email or Password!";

                    document.getElementById("message")
                        .style.color = "red";
                }
            }
        );

        // Logout function
        document.getElementById("logoutButton").onclick = function() {
            document.getElementById("dashboardPage")
                .classList.add("hidden");

            document.getElementById("loginPage")
                .classList.remove("hidden");

            document.getElementById("loginForm").reset();

            document.getElementById("message").textContent = "";
        };
    </script>

</body>
</html>
